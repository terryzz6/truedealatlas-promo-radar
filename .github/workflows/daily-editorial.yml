name: Publish daily shopping guide
on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Select the next original guide
        run: python tools/daily_article.py
      - name: Build static site
        run: python build.py
      - name: Commit the guide and generated pages
        run: |
          git config user.name "true-deal-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/articles.json site
          if git diff --cached --quiet; then
            echo "No new guide selected"
          else
            git commit -m "content: publish daily shopping guide"
            git push
          fi
